  <link rel="alternate" hreflang="de" href="de/index.html" />

</head>
<body>
  <p><a href="it/index.html">Continua verso iCanSaveit</a></p>
  <script>
    (function () {
      var supported = ["it", "en", "de", "es", "fr", "pt"];
      var candidates = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || navigator.userLanguage || "it"];
      var target = "it";
      for (var i = 0; i < candidates.length; i++) {
        var code = String(candidates[i]).slice(0, 2).toLowerCase();
        if (supported.indexOf(code) !== -1) {
          target = code;
          break;
        }
      }
      window.location.replace(target + "/index.html");
    })();
  </script>
</body>
